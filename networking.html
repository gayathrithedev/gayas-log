<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem("gayas-log-theme");
          if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.dataset.theme = savedTheme;
            document.documentElement.style.colorScheme = savedTheme;
            document.querySelector('meta[name="theme-color"]')?.setAttribute(
              "content",
              savedTheme === "dark" ? "#121413" : "#FFFFFF"
            );
          }
        } catch {
          // Fall back to the light theme if storage is unavailable.
        }
      })();
    </script>

    <title>Out & Networking — Gayathri Perumal</title>
    <meta name="description" content="Meetups, conferences, and community moments with Gayathri Perumal." />
    <link rel="canonical" href="https://gayas-log-public.vercel.app/networking.html" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Out & Networking — Gayathri Perumal" />
    <meta property="og:description" content="Meetups, conferences, and community moments with Gayathri Perumal." />
    <meta property="og:url" content="https://gayas-log-public.vercel.app/networking.html" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@gayathrithedev" />

    <!-- Latin faces are self-hosted via @fontsource (see src/main.jsx).
         This one request covers the Tamil greeting in the hero — remove it
         if you change `profile.greeting` to Latin text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
