<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121413" />

    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem("gayas-log-theme");
          if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.dataset.theme = savedTheme;
            document.documentElement.style.colorScheme = savedTheme;
            document.querySelector('meta[name="theme-color"]')?.setAttribute(
              "content",
              savedTheme === "dark" ? "#121413" : "#FFFFFF"
            );
          }
        } catch {
          // Fall back to the dark theme if storage is unavailable.
        }
      })();
    </script>

    <title>Books — Gayathri Perumal</title>
    <meta name="description" content="A cozy little bookshelf: books I have finished, books in progress, and room for my next read." />
    <link rel="canonical" href="https://www.gayathriperumal.in/books.html" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Books — Gayathri Perumal" />
    <meta property="og:description" content="A cozy little bookshelf: books I have finished, books in progress, and room for my next read." />
    <meta property="og:url" content="https://www.gayathriperumal.in/books.html" />
    <meta property="og:image" content="https://www.gayathriperumal.in/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@gayathrithedev" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
